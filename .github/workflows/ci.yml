name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: pnpm install --frozen-lockfile
      # lint + check (fmt/lint/型) + test (Vitest) + build
      - run: pnpm run ci
      # packages/cloudflare のテストは workerd 上で動く別インスタンスのため集約実行に乗らない (development.md 参照)
      - run: pnpm --filter @hakoniwajs/cloudflare test
