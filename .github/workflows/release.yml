name: release

on:
  push:
    branches: [main]
  # publish だけ失敗したとき等に、既存タグを指定して publish をやり直せるようにする。
  # (tagpr が出力するタグはタグを作った run でしか取れないため、push トリガーの
  #  再実行では代替できない)
  workflow_dispatch:
    inputs:
      tag:
        description: "公開し直す既存タグ (例: v0.1.0)"
        required: true
        type: string

env:
  # 追従先のテンプレートリポジトリ ("<owner>/<repo>" 形式)。
  # vars.TEMPLATE_REPO で上書きできる (dry-run 時にスクラッチリポジトリへ向ける等)。
  TEMPLATE_REPO: ${{ vars.TEMPLATE_REPO || 'hakoniwajs/template-cloudflare' }}

permissions:
  contents: write
  pull-requests: write
  issues: read
  id-token: write # npm Trusted Publishing (OIDC) 用

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # push イベントでは tagpr がリリース PR を作成・更新する。
      # リリース PR のマージ時は tagpr がタグと GitHub Release を作り、
      # outputs.tag にタグ名が入る。
      - name: Run tagpr
        id: tagpr
        if: github.event_name == 'push'
        uses: Songmu/tagpr@2afc990a4a5a9a340665cc1a484c2102f7de332f # v1.21.0
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # push 時は tagpr が作ったタグ、dispatch 時は入力されたタグが publish 対象。
      # publish をこのジョブに同居させているのは、GITHUB_TOKEN で作られた
      # タグ/Release は後続 workflow を起動しない (GitHub の仕様) ため。
      - name: Resolve tag
        id: resolve
        env:
          DISPATCH_TAG: "${{ inputs.tag }}"
          TAGPR_TAG: "${{ steps.tagpr.outputs.tag }}"
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if ! git rev-parse "refs/tags/$DISPATCH_TAG" >/dev/null 2>&1; then
              echo "::error::tag $DISPATCH_TAG does not exist"
              exit 1
            fi
            git checkout "$DISPATCH_TAG"
            echo "tag=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$TAGPR_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up toolchain
        if: steps.resolve.outputs.tag != ''
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install dependencies
        if: steps.resolve.outputs.tag != ''
        run: pnpm install --frozen-lockfile

      - name: Build packages
        if: steps.resolve.outputs.tag != ''
        run: pnpm -r run build

      # npm Trusted Publishing (OIDC) で認証する (NPM_TOKEN 不要)。
      # pnpm 11+ の `pnpm publish` は OIDC をネイティブ実装している。
      # 事前に npmjs.com で各パッケージ (@hakoniwajs/{core,node,cloudflare}) の
      # Trusted Publisher にこのリポジトリの release.yml を登録しておくこと。
      # publishConfig.access = public は各パッケージ側で設定済み。
      # workspace:* 依存は publish 時に実バージョンへ書き換えられる。
      - name: Publish to npm
        if: steps.resolve.outputs.tag != ''
        run: pnpm -r publish --no-git-checks

      # dispatch 時は Release が無い場合に備えて作る (push 時は tagpr が作成済み)
      - name: Ensure GitHub Release exists
        if: steps.resolve.outputs.tag != '' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          TAG: "${{ steps.resolve.outputs.tag }}"
        run: gh release view "$TAG" || gh release create "$TAG" --title "$TAG" --notes "See CHANGELOG.md"

      # --- テンプレートリポジトリ (TEMPLATE_REPO) への追従 ---
      # syumai/workers-go → syumai/workers のミラー同期と同じ構成:
      # GITHUB_TOKEN は他リポジトリへ push できないため、テンプレート用の
      # deploy key (TEMPLATE_CLOUDFLARE_DEPLOY_KEY secret、テンプレートリポジトリへの
      # 書き込みのみ許可した秘密鍵) で SSH clone → 更新 → push する。
      # この secret は必須: 未設定のままリリースするとここで失敗する。
      - name: Set up template deploy key
        if: steps.resolve.outputs.tag != ''
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.TEMPLATE_CLOUDFLARE_DEPLOY_KEY }}

      - name: Trust github.com's host key
        if: steps.resolve.outputs.tag != ''
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t rsa,ed25519 github.com >> ~/.ssh/known_hosts

      - name: Clone template repository
        if: steps.resolve.outputs.tag != ''
        run: git clone "git@github.com:${TEMPLATE_REPO}.git" ../template

      # @hakoniwajs/* の依存をリリースしたバージョンに揃え、lockfile も更新する。
      # publish 直後は npm registry への反映に多少ラグがあり得るため、
      # 更新後に `npm install` が取れることをもって反映確認とする。
      - name: Bump @hakoniwajs deps in template
        if: steps.resolve.outputs.tag != ''
        working-directory: ../template
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # 下の node -e が process.env.VERSION として読むため export する
          # (export しないと package.json に "undefined" が書き込まれる)
          export VERSION="${TAG#v}"
          # dependencies/devDependencies の @hakoniwajs/* を新バージョンに更新
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const v = process.env.VERSION;
            if (!v) throw new Error("VERSION is not set");
            for (const section of ["dependencies", "devDependencies"]) {
              for (const name of Object.keys(pkg[section] ?? {})) {
                if (name.startsWith("@hakoniwajs/")) {
                  const prefix = pkg[section][name].startsWith("^") ? "^" : "";
                  pkg[section][name] = prefix + v;
                }
              }
            }
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          for i in $(seq 1 30); do
            if npm install --package-lock-only --ignore-scripts; then
              exit 0
            fi
            echo "attempt $i/30: npm registry に $VERSION がまだ見えない。10s 待機"
            sleep 10
          done
          echo "::error::@hakoniwajs/*@$VERSION が npm registry に反映されませんでした"
          exit 1

      - name: Commit and push to template
        if: steps.resolve.outputs.tag != ''
        working-directory: ../template
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "テンプレートに変更なし (既に $TAG 相当)"
          else
            git commit -m "sync @hakoniwajs/* to ${TAG}"
            git push origin HEAD:main
          fi
